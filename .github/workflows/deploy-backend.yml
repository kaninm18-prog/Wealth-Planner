# Tests the backend (src/*.gs), then deploys it to Google Apps Script and updates the EXISTING web-app deployment,
# so the URL in the app's Settings never changes.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   Secret   CLASPRC_JSON   contents of ~/.clasprc.json after `clasp login` (clasp 2.4.2)
#   Variable SCRIPT_ID      Apps Script → Project Settings → Script ID
#   Secret   DEPLOYMENT_ID  Apps Script → Deploy → Manage deployments → Deployment ID (secret: it is the key to your data, keep it out of logs)
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/deploy-backend.yml']
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the backend parses
        run: cat src/*.gs > /tmp/backend.js && node --check /tmp/backend.js

      - name: Install tools
        run: npm ci

      - name: Lint (an error stops the deploy)
        run: npm run lint

      - name: Run tests (a failing test stops the deploy)
        run: npm test

      - name: Install clasp
        run: npm install -g @google/clasp@2.4.2

      - name: Sign in
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC" || { echo "Secret CLASPRC_JSON is missing"; exit 1; }
          printf '%s' "$CLASPRC" > ~/.clasprc.json

      - name: Pull the live project (keeps its manifest, makes a backup)
        env:
          SCRIPT_ID: ${{ vars.SCRIPT_ID }}
        run: |
          test -n "$SCRIPT_ID" || { echo "Variable SCRIPT_ID is missing"; exit 1; }
          mkdir build && cd build
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
          clasp pull
          ls -la
          # Only overwrite this app's own backend, or a brand-new project that still holds the editor's starter code.
          if ls *.html >/dev/null 2>&1; then
            echo "This project has HTML files — it doesn't look like the Wealth Planner backend (check SCRIPT_ID). Stopping."; exit 1
          fi
          if grep -l "function doPost" *.js >/dev/null 2>&1; then
            if ! grep -q "Wealth Planner" *.js; then
              echo "This looks like another app's backend, not the Wealth Planner (check SCRIPT_ID). Stopping."; exit 1
            fi
          elif [ "$(ls *.js 2>/dev/null | wc -l)" -le 1 ] && ! grep -qv -e '^\s*$' -e 'function myFunction' -e '^\s*}\s*$' -e '^\s*//' *.js 2>/dev/null; then
            echo "Brand-new project (only the starter myFunction) — first deploy."
          else
            echo "This project has code that isn't the Wealth Planner backend (check SCRIPT_ID). Stopping."; exit 1
          fi
          grep -q '"webapp"' appsscript.json || { echo "appsscript.json has no web app settings — in Apps Script, Deploy → Manage deployments → make the deployment a Web app (Execute as: Me, Who has access: Anyone), then re-run."; exit 1; }
          mkdir -p ../backup && cp *.js appsscript.json ../backup/

      - name: Upload backup of the previous live code
        uses: actions/upload-artifact@v5
        with:
          name: live-backend-before-${{ github.sha }}
          path: backup/
          retention-days: 90

      - name: Push new code
        run: |
          cd build
          rm -f *.js
          cp ../src/*.gs .
          ls
          clasp push -f

      - name: Update the existing deployment (same URL)
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          test -n "$DEPLOYMENT_ID" || { echo "Secret DEPLOYMENT_ID is missing"; exit 1; }
          case "$DEPLOYMENT_ID" in AKfyc*AKfyc*) echo "DEPLOYMENT_ID looks pasted twice — check the secret"; exit 1;; esac
          cd build
          clasp deploy -i "$DEPLOYMENT_ID" -d "github ${GITHUB_SHA::7}"
